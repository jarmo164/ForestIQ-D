services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forestiq}
      POSTGRES_USER: ${POSTGRES_USER:-forestiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forestiq}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - forestiq_postgres:/var/lib/postgresql/data
    networks:
      - apidb

  api:
    build:
      context: .
      dockerfile: django_backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-forestiq}
      POSTGRES_USER: ${POSTGRES_USER:-forestiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forestiq}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FORESTIQ_DEVMODE: ${FORESTIQ_DEVMODE:-false}
      TIME_ZONE: Europe/Tallinn
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py seed_demo_data &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -"
    networks:
      - apidb
      - uiapi

  worker:
    build:
      context: .
      dockerfile: django_backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forestiq}
      POSTGRES_USER: ${POSTGRES_USER:-forestiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forestiq}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_Q_WORKERS: ${DJANGO_Q_WORKERS:-2}
      DJANGO_Q_TIMEOUT_SECONDS: ${DJANGO_Q_TIMEOUT_SECONDS:-300}
      DJANGO_Q_RETRY_SECONDS: ${DJANGO_Q_RETRY_SECONDS:-360}
      FORESTIQ_SYNC_HTTP_TIMEOUT_SECONDS: ${FORESTIQ_SYNC_HTTP_TIMEOUT_SECONDS:-30}
      FORESTIQ_SYNC_USER_AGENT: ${FORESTIQ_SYNC_USER_AGENT:-ForestIQ-data-synchronizer/1.0}
      FORESTIQ_CADASTRE_WFS_URL: ${FORESTIQ_CADASTRE_WFS_URL:-https://gsavalik.envir.ee/geoserver/kataster/wfs}
      FORESTIQ_CADASTRE_WFS_LAYER: ${FORESTIQ_CADASTRE_WFS_LAYER:-kataster:ky_kehtiv}
      FORESTIQ_METSAREGISTER_WFS_URL: ${FORESTIQ_METSAREGISTER_WFS_URL:-https://gsavalik.envir.ee/geoserver/metsaregister/ows}
      FORESTIQ_METSAREGISTER_WFS_LAYERS: ${FORESTIQ_METSAREGISTER_WFS_LAYERS:-metsaregister:eraldis}
      FORESTIQ_SOOS_WFS_URL: ${FORESTIQ_SOOS_WFS_URL:-}
      FORESTIQ_SOOS_WFS_LAYER: ${FORESTIQ_SOOS_WFS_LAYER:-}
      FORESTIQ_SOOS_WFS_CADASTRE_FIELD: ${FORESTIQ_SOOS_WFS_CADASTRE_FIELD:-katastri_nr}
      FORESTEK_API_URL: ${FORESTEK_API_URL:-}
      FORESTEK_API_TOKEN: ${FORESTEK_API_TOKEN:-}
      PARIMUS_API_URL: ${PARIMUS_API_URL:-}
      PARIMUS_API_TOKEN: ${PARIMUS_API_TOKEN:-}
      TIME_ZONE: Europe/Tallinn
    command: python manage.py qcluster
    networks:
      - apidb

  ui:
    build:
      context: .
      dockerfile: forestiq-ui/Dockerfile
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - uiapi

volumes:
  forestiq_postgres:

networks:
  uiapi:
  apidb:
