<div class="card">
  <div class="card-header">
    Sent messages
  </div>
  <div class="card-body">
    <table class="table">
      <thead>
      <tr>
        <th>Time</th>
        <th>Receiver</th>
        <th>Message</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let message of messages | async">
        <td>{{message.createdAt | date: 'dd.MM.yyyy HH:mm'}}</td>
        <td>{{message.recipient}}</td>
        <td [innerHTML]="message.message | linkifyMessage"></td>
      </tr>
      </tbody>
    </table>
    <p>
      <button class="btn btn-success" (click)="toTheBeginning()">Show newest</button>
      <button class="btn btn-success" (click)="nextPage()">Show next {{numberOfMessages}} messages</button>
    </p>
  </div>
</div>
<br>
<div class="card" *ngIf="!usersLoading">
  <div class="card-header">
    Send a new direct message
  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-12">
        <textarea [(ngModel)]="messageText" id="newMessageText"></textarea>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <p>Receivers:</p>
        <p *ngFor="let username of users">
          <input type="checkbox" [(ngModel)]="checkedUserNames[username]" /> {{username}}
        </p>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <button class="btn btn-success" (click)="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>
