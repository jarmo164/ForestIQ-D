<div class="alert alert-danger" *ngIf="latestEvaluation.error">{{latestEvaluation.error}}</div>
<div class="big-loader" *ngIf="latestEvaluation.loading"></div>
<form (ngSubmit)="submitEvaluation()" *ngIf="latestEvaluation.data">
  <fieldset [disabled]="evaluationSubmit.loading">
    <div class="form-group row">
      <label for="owner-priceoffer" class="col-sm-4 col-form-label nowrap">Owner priceoffer:</label>
      <input type="text" class="form-control col-sm-8" id="owner-priceoffer" name="owner-priceoffer"
             placeholder="Owner priceoffer" [(ngModel)]="latestEvaluation.data.ownerPrice">
    </div>

    <div class="form-group row">
      <label for="our-priceoffer" class="col-sm-4 col-form-label nowrap">Our priceoffer:</label>
      <input type="text" class="form-control col-sm-8" id="our-priceoffer" name="our-priceoffer"
             placeholder="Our priceoffer" [(ngModel)]="latestEvaluation.data.ourPrice">
    </div>

    <div class="row">
      <div class="col-sm-12">
        <button type="submit" class="btn btn-primary"><span class="fa fa-save"></span> Save</button>
      </div>
    </div>
    <br>
    <div class="alert alert-danger" *ngIf="evaluationSubmit.error">{{evaluationSubmit.error}}</div>
  </fieldset>
</form>
