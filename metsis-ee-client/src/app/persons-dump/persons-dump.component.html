<div class="simple-content-container">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header">
          Phonebook search (max 1000 results)
        </div>
        <div class="card-body">
            <table class="table table-striped">
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Code</th>
                <th>Source</th>
              </tr>
              <tr>
                <td><input (input)="search()" type="text" class="form-control" name="name" [(ngModel)]="personsDumpCriteria.name"></td>
                <td><input (input)="search()" type="text" class="form-control" name="name" [(ngModel)]="personsDumpCriteria.phone"></td>
                <td><input (input)="search()" type="text" class="form-control" name="name" [(ngModel)]="personsDumpCriteria.address"></td>
                <td><input (input)="search()" type="text" class="form-control" name="name" [(ngModel)]="personsDumpCriteria.code"></td>
                <td><input (input)="search()" type="text" class="form-control" name="name" [(ngModel)]="personsDumpCriteria.source"></td>
                <td></td>
              </tr>
              <tr *ngIf="personsDumpSearchResult.error">
                <td colspan="5">
                  <div class="col-sm-12 alert-danger alert">
                    {{personsDumpSearchResult.error}}
                  </div>
                </td>
              </tr>
              <tr *ngIf="personsDumpSearchResult.loading">
                <td colspan="5">
                  <div class="big-loader"></div>
                </td>
              </tr>
              <tr *ngFor="let entry of personsDumpSearchResult.data">
                <td>{{entry.name}}</td>
                <td>{{entry.phone}}</td>
                <td>{{entry.address}}</td>
                <td>{{entry.code}}</td>
                <td>{{entry.source}}</td>
                <td>
                  <button class="btn btn-danger" (click)="deleteEntry(entry.id)">Delete</button>
                </td>
              </tr>
            </table>
        </div>
      </div>
    </div>
  </div>
  <br>
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          Add new phonebook entry
        </div>
        <div class="card-body">
          <form [formGroup]="addPhonebookEntryForm" (ngSubmit)="onAddPersonSubmit(addPhonebookEntryForm.value)" class="col-4">
            <fieldset [disabled]="addEntryLoading">
              <div class="form-group row">
                <label for="code">
                  ID Code/Reg No:
                </label>
                <input id="code" type="text" class="form-control" formControlName="code">
              </div>

              <div class="form-group row">
                <label for="name">
                  Name:
                </label>
                <input id="name" type="text" class="form-control" formControlName="name">
              </div>

              <div class="form-group row">
                <label for="phone">
                  Phone:
                </label>
                <input id="phone" type="text" class="form-control" formControlName="phone">
              </div>

              <div class="form-group row">
                <label for="address">
                  Address:
                </label>
                <input id="address" type="text" class="form-control" formControlName="address">
              </div>

              <div class="form-group row">
                <button type="submit" class="btn btn-info">Save</button>
              </div>
            </fieldset>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
