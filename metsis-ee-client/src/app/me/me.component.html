<div class="simple-content-container">
  <div class="card">
    <div class="card-header">
      Change password
    </div>
    <div class="card-body">
      <form class="form" (ngSubmit)="changePassword(pwChangeModel)">
        <fieldset [disabled]="pwChange.loading">
          <div class="form-group">
            <input type="password" class="form-control" id="old-password" name="old-password"
                   placeholder="Current password" [(ngModel)]="pwChangeModel.oldPassword" >
          </div>
          <div class="form-group">
            <input type="password" class="form-control" id="new-password" name="new-password"
                   placeholder="New password" [(ngModel)]="pwChangeModel.newPassword">
          </div>
          <div class="form-group">
            <input type="password" class="form-control" id="new-password-again" name="new-password-again"
                   placeholder="New password again" [(ngModel)]="pwChangeModel.newPasswordAgain">
          </div>
          <div class="row">
            <div class="col-sm-2">
              <button type="submit" class="btn btn-primary">Submit</button>
            </div>
            <div class="col-sm-10">
              <div class="alert alert-danger" *ngIf="pwChange.error">{{pwChange.error}}</div>
              <div class="alert alert-success" *ngIf="pwChange.data">Password is successfully changed</div>
            </div>
          </div>
        </fieldset>
      </form>
    </div>
  </div>
</div>
