events {
    worker_connections  1024;
}

http {
    log_format  main  '$request_id $remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=uilimit:10m rate=100r/s;

    upstream metsisapi {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen *:443 ssl;

        ssl_certificate /etc/nginx/ssl/server.pem;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_prefer_server_ciphers on;

        ssl_verify_client off;

        proxy_ignore_client_abort on;

        gzip on;
        gzip_disable "msie6";
        gzip_types  text/plain application/javascript application/x-javascript text/javascript text/xml text/css application/json;

        location /api {
            limit_req zone=apilimit burst=5;
            proxy_pass http://metsisapi/api;
        }

        location / {
            limit_req zone=uilimit burst=30;
            root /usr/share/nginx/html;
            index  index.html index.htm;
            include /etc/nginx/mime.types;
            add_header Cache-Control no-cache;
            try_files $uri $uri/ /index.html?$query_string;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    include servers/*;
}
