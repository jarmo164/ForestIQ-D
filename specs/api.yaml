                description: Error message
        '403':
          description: Forbidden. Not enough privileges for this action.
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '404':
          description: Not found
          content:
            application/text:
              schema:
                type: string
                description: Error message

    delete:
      summary: Delete owner status
      operationId: deleteOwnerStatus
      tags:
        - ownerStatuses
      parameters:
        - name: id
          in: path
          description: Status ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '404':
          description: Not found
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '403':
          description: Forbidden. Not enough privileges for this action.
          content:
            application/text:
              schema:
                type: string
                description: Error message

  /admin-workdesk/owners/:
    get:
      summary: Search across all owners by different criteria.
      operationId: findOwners
      tags:
        - adminWorkdesk
      parameters:
        - name: county
          in: query
          description: County
          required: false
          schema:
            type: array
            items:
              type: string
        - name: municipality
          in: query
          description: Municipality
          required: false
          schema:
            type: array
            items:
              type: string
        - name: minArea
          in: query
          description: Minimum area
          required: false
          schema:
            type: integer
            format: int64
        - name: maxArea
          in: query
          description: Maximum area
          required: false
          schema:
            type: integer
            format: int64
        - name: minForestArea
          in: query
          description: Maximum forest area
          required: false
          schema:
            type: integer
            format: int64
        - name: maxForestArea
          in: query
          description: Maximum forest area
          required: false
          schema:
            type: integer
            format: int64
        - name: minArableArea
          in: query
          description: Maximum arable area
          required: false
          schema:
            type: integer
            format: int64
        - name: maxArableArea
          in: query
          description: Maximum arable area
          required: false
          schema:
            type: integer
            format: int64
        - name: conservations
          in: query
          description: Natural conservations
          required: true
          schema:
            $ref: 'models.yaml#/components/schemas/ApiAdminWorkdeskConservationsIncludes'
        - name: withSuspensionReason
          in: query
          description: Owners who are otherwise suspended from search with given reason
          required: false
          schema:
            type: string
        - name: mustHavePhoneNumber
          in: query
          description: Only include owners with phone number
          required: false
          schema:
            type: boolean
        - name: assignee
          in: query
          description: Owners who are assigned to given assignee (user id)
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Owners with status
          required: false
          schema:
            type: string
        - name: size
          in: query
          description: Maximum number of results
          required: true
          schema:
            type: integer
            format: int64
        - name: owner_type
          in: query
          description: Which kind of owners to include
          required: true
          schema:
            type: array
            items:
              $ref: 'models.yaml#/components/schemas/ApiOwnerType'
        - name: hasNotificationsSince
          in: query
          description: Cadastre has forestnotifications at least as new as this date.
          required: false
          schema:
            type: date
        - name: hasForestPlanSince
          in: query
          description: Cadastre has forestry plan at least as new as this date.
          required: false
          schema:
            type: date
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'models.yaml#/components/schemas/ApiOwnerOverview'
        '400':
          description: Bad request
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '403':
          description: Forbidden. Not enough privileges for this action.
          content:
            application/text:
              schema:
                type: string
                description: Error message

