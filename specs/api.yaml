openapi: 3.0.3
info:
  title: Metsis API
  description: Metsis API is HTTP RESTful JSON based API meant to be consumed by Metsis UI SPA.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: usersAdministration
    x-displayName: Users Administration
  - name: usersStatistics
    x-displayName: Users Statistics
  - name: ownerStatuses
    x-displayName: Owner Statuses
  - name: adminWorkdesk
    x-displayName: Administrator Workdesk
  - name: contracts
    x-displayName: Contracts
  - name: evaluations
    x-displayName: Evaluations
  - name: applicationMessages
    x-displayName: Application Messages
  - name: cadastres
    x-displayName: Cadastres
  - name: owners
    x-displayName: Owners
  - name: myWork
    x-displayName: My Work
  - name: reminders
    x-displayName: Reminders
  - name: persons
    x-displayName: Persons

paths:

  /users:
    get:
      summary: Fetches minimal information about application users (id, name, privileges)
      operationId: findAllUsers
      tags:
        - usersAdministration
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'models.yaml#/components/schemas/ApiMaintainableUser'
    post:
      summary: Creates a new application user
      operationId: createUser
      tags:
        - usersAdministration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'models.yaml#/components/schemas/ApiMaintainableUser'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: 'models.yaml#/components/schemas/ApiMaintainableUserWithPassword'
        '400':
          description: Bad request
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '403':
          description: Forbidden. Not enough privileges for this action.
          content:
            application/text:
              schema:
                type: string
                description: Error message

  /users/{id}:
    delete:
      summary: Deletes user
      operationId: deleteUser
      tags:
        - usersAdministration
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '403':
          description: Forbidden. Not enough privileges for this action.
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '404':
          description: User with given ID was not found
          content:
            application/text:
              schema:
                type: string
                description: Error message

  /users/{id}/privileges:
    put:
      summary: Changes user privileges
      operationId: changeUserPrivileges
      tags:
        - usersAdministration
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: 'models.yaml#/components/schemas/ApiPrivilege'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: 'models.yaml#/components/schemas/ApiMaintainableUser'
        '400':
          description: Bad request
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '403':
          description: Forbidden. Not enough privileges for this action.
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '404':
          description: User with given ID was not found
          content:
            application/text:
              schema:
                type: string
                description: Error message

  /user-statistics:
    get:
      summary: Fetches statistics about user made owner status changes
      operationId: getUsersStatistics
      tags:
        - usersStatistics
      parameters:
        - name: userId
          in: query
          description: User IDs to find statistics about.
          required: true
          schema:
            type: array
            items:
              type: string
        - name: fromStatus
          in: query
          description: Status changed from one state to another. This is the from side of transition.
          required: true
          schema:
            type: array
            items:
              type: string
        - name: toStatus
          in: query
          description: Status changed from one state to another. This is the to side of transition.
          required: true
          schema:
            type: array
            items:
              type: string
        - name: granularity
          in: query
          description: Granularity of statistics. One datapoint represents either DAY or HOUR.
          required: true
          schema:
            $ref: 'models.yaml#/components/schemas/ApiUserStatisticsGranularity'
        - name: since
          in: query
          description: Start time of statistics
          required: true
          schema:
            type: string
            format: date-time
        - name: upTo
          in: query
          description: End time of statistics
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'models.yaml#/components/schemas/ApiUserOwnerStatusChangeStatistics'
        '400':
          description: Bad request
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '403':
          description: Forbidden. Not enough privileges for this action.
          content:
            application/text:
              schema:
                type: string
                description: Error message

  /user-statistics/filters:
    get:
      summary: Fetches filters to help querying user statistics
      operationId: getUsersStatisticsFilters
      tags:
        - usersStatistics
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
