              schema:
                type: string
                description: Error message

    post:
      summary: Add new owner status
      operationId: addOwnerStatus
      tags:
        - ownerStatuses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'models.yaml#/components/schemas/ApiOwnerStatus'
