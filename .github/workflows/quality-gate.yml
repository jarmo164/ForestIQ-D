name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    name: Django checks, migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: forestiq
          POSTGRES_USER: forestiq
          POSTGRES_PASSWORD: forestiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forestiq -d forestiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forestiq:forestiq@localhost:5432/forestiq
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "true"
      FORESTIQ_DEVMODE: "true"
      FORESTIQ_TASKS_INLINE: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install geospatial system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gdal-bin libgdal-dev libgeos-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify migration files are current
        working-directory: django_backend
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: django_backend
        run: python manage.py migrate --noinput

      - name: Run Django system checks
        working-directory: django_backend
        run: python manage.py check

      - name: Generate and verify the versioned OpenAPI contract
        working-directory: django_backend
        run: |
          python manage.py spectacular --file ../api_contracts/openapi-v1.generated.yaml --validate --urlconf config.api_v1_urls
          diff --unified=3 ../api_contracts/openapi-v1.yaml ../api_contracts/openapi-v1.generated.yaml
          rm ../api_contracts/openapi-v1.generated.yaml

      - name: Run Django test suite and enforce critical backend coverage
        env:
          FORESTIQ_BACKEND_CRITICAL_COVERAGE_MIN: "60"
        run: bash scripts/run_backend_critical_coverage.sh

  frontend:
    name: Frontend typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: forestiq-ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: forestiq-ui
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: forestiq-ui
        run: pnpm check

      - name: Lint
        working-directory: forestiq-ui
        run: pnpm lint

      - name: Run unit tests
        working-directory: forestiq-ui
        run: pnpm test

      - name: Enforce critical frontend coverage
        working-directory: forestiq-ui
        run: pnpm test:coverage:critical

      - name: Install Playwright Chromium
        working-directory: forestiq-ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Run deterministic critical E2E workflows
        working-directory: forestiq-ui
        run: pnpm test:e2e

      - name: Build
        working-directory: forestiq-ui
        run: pnpm build

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependency audit tool
        run: python -m pip install pip-audit==2.9.0

      - name: Validate temporary security exceptions
        run: python scripts/validate_security_exceptions.py security-exceptions.json

      - name: Audit Python dependencies
        run: |
          mkdir -p security-reports
          set +e
          pip-audit --strict --requirement requirements.txt --format json > security-reports/pip-audit.json
          audit_status=$?
          set -e
          python scripts/check_dependency_audit.py pip-audit security-reports/pip-audit.json security-exceptions.json
          echo "pip-audit exit status: ${audit_status}"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: forestiq-ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: forestiq-ui
        run: pnpm install --frozen-lockfile

      - name: Audit frontend high and critical dependencies
        run: |
          mkdir -p security-reports
          set +e
          pnpm --dir forestiq-ui audit --json > security-reports/pnpm-audit.json
          audit_status=$?
          set -e
          python scripts/check_dependency_audit.py pnpm-audit security-reports/pnpm-audit.json security-exceptions.json
          echo "pnpm audit exit status: ${audit_status}"

      - name: Scan repository history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  render_blueprint:
    name: Render Blueprint validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blueprint schema validator
        run: python -m pip install check-jsonschema==0.33.0

      - name: Validate render.yaml against Render's official Blueprint schema
        run: >-
          check-jsonschema
          --schemafile https://render.com/schema/render.yaml.json
          render.yaml

  quality_gate:
    name: All quality checks passed
    if: ${{ always() }}
    needs:
      - django
      - frontend
      - security
      - render_blueprint
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality check to pass
        env:
          DJANGO_RESULT: ${{ needs.django.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          RENDER_RESULT: ${{ needs.render_blueprint.result }}
        run: |
          test "$DJANGO_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$RENDER_RESULT" = "success"
