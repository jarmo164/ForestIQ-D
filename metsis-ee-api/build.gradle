buildscript {
    repositories {
        jcenter()
    }
    dependencies {
        classpath 'com.github.jengelman.gradle.plugins:shadow:6.0.0'
    }
}

plugins {
    id "application"
}

apply plugin : "java"
apply plugin: 'com.github.johnrengelman.shadow'

ext {
    javaMainClass = "ee.metsis.AppRunner"
}

application {
    mainClassName = javaMainClass
}

jar {
    manifest {
        attributes 'Main-Class': javaMainClass
    }
}

group 'ee.mets'
version '1.0.0'

repositories {
    mavenCentral()
}


tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation" // Makes warnings verbose in build log
}

dependencies {

    repositories {
        mavenCentral()
    }

    compile group: 'javax.xml.soap', name: 'saaj-api', version: '1.3.5'
    compile group: 'commons-io', name: 'commons-io', version: '2.6'
    compile group: 'com.itextpdf', name: 'itextpdf', version: '5.5.13'
    compile group: 'com.sparkjava', name: 'spark-core', version: '2.8.0'
    compile group: 'org.bouncycastle', name: 'bcprov-jdk16', version: '1.46'
    compile group: 'com.auth0', name: 'java-jwt', version: '3.4.1'
    compile('org.apache.commons:commons-csv:1.6')

    compile group: 'com.itextpdf', name: 'itext7-core', version: '7.1.11', ext: 'pom'
    compile group: 'com.itextpdf', name: 'html2pdf', version: '3.0.0'
    compile group: 'org.apache.velocity', name: 'velocity', version: '1.7'
    compile group: 'org.apache.velocity', name: 'velocity-tools', version: '2.0'

    compile "com.sparkjava:spark-core:2.7.2"

    //auth
    compile "com.auth0:java-jwt:3.3.0"
    compile 'org.mindrot:jbcrypt:0.4'
    compile 'org.bouncycastle:bcprov-jdk15:1.46'

    //logging
    compile 'log4j:log4j:1.2.17'
    compile 'org.slf4j:slf4j-api:1.7.25'
    compile 'org.slf4j:slf4j-log4j12:1.7.25'

    //db
    compile "org.postgresql:postgresql:9.4.1212"
    compile 'commons-dbutils:commons-dbutils:1.7'

    //http client
    compile group: 'org.apache.httpcomponents', name: 'fluent-hc', version: '4.5.5'

    //serialization
    compile 'com.google.code.gson:gson:2.8.2'
    compile group: 'org.jsoup', name: 'jsoup', version: '1.11.3'

    //framework
    compile 'org.reflections:reflections:0.9.11'


    compile group: 'org.apache.httpcomponents', name: 'fluent-hc', version: '4.5.6'
    compile group: 'org.jsoup', name: 'jsoup', version: '1.11.3'
    compile group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.0'
    compile group: 'com.sun.xml.bind', name: 'jaxb-core', version: '2.3.0'
    compile group: 'com.sun.xml.bind', name: 'jaxb-impl', version: '2.3.0'
    compile group: 'javax.jws', name: 'javax.jws-api', version: '1.1'
    compile group: 'javax.xml.ws', name: 'jaxws-api', version: '2.3.1'
    compile group: 'org.liquibase', name: 'liquibase-core', version: '3.8.9'
    compile group: 'org.yaml', name: 'snakeyaml', version: '1.26'

    testCompile 'org.mockito:mockito-core:2.22.0'
    testCompile group: 'junit', name: 'junit', version: '4.12'
}
